name: PR scopes

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  title:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the title is scoped
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^(core|repo|server|web)(, (core|repo|server|web))*: [A-Z]'; then
            echo "::error title=PR title::Expected '<scopes>: <Sentence starting with a capital letter>', scopes from core, repo, server, web (e.g. 'server, web: Save a Session Result'). Got: $PR_TITLE"
            exit 1
          fi
